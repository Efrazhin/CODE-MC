<!DOCTYPE html>
<html lang="en">
    {% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de sesión</title>
    
    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="{% static 'miapp_CODEMC/css-vistas/style-login.css' %}">
</head>
<body>
    <div class="flex">
        <div class="contenedor">
            <h1>Inicio de sesión</h1>

            <!-- Close button with redirect function -->
            <div class="cerrar-ventana" onclick="redirigirPrincipal()">
                <i class="fa-solid fa-rectangle-xmark"></i>
            </div>

            <div class="form-box-login">
                <!-- Login form -->
                <form method="post" class="form_flex">
                    {% csrf_token %}
                    
                    

                    <div class="input-field">
                        <i class="fa-solid fa-envelope"></i>
                        {{ form.username }}
                    </div>
                    
                    <!-- Password input field with icon -->
                    <div class="input-field">
                        <i class="fa-solid fa-lock"></i> 
                        {{ form.password }}
                    </div>

                    <!-- Display messages if they exist -->
                    {% if messages %}
                    <ul class="messages">
                        {% for message in messages %}
                        <li class="{{ message.tags }}">{{ message }}</li>
                        {% endfor %}
                    </ul>
                    {% endif %}
                    {{ error }}

                    <!-- Remember me and forgot password section -->
                    <div class="forget">
                        <label for="remember">
                            <input type="checkbox" id="remember">
                            <span>Recordarme</span>
                        </label>
                        <a href="#">¿Olvidaste tu contraseña?</a>
                    </div>

                    <!-- Submit button -->
                    <button type="submit">Iniciar sesión</button>

                    <!-- Registration prompt -->
                    <div class="register">
                        <p>¿No tienes una cuenta? <a href="{% url 'registro-usuario' %}" class="register-link">¡Crea una!</a></p>
                    </div>
                </form>
            </div>
        </div>  

        <!-- Image container -->
        <div class="caja_img">
            <!-- Image content can go here -->
        </div>
    </div>

    <!-- JavaScript for login functionalities -->
    <script src="{% static 'miapp_CODEMC/js/java_scr_login.js' %}"></script>
    <script>
        // Redirect to homepage function
        function redirigirPrincipal() {
            window.location.href = "/"; // Redirects to home
        }
    </script>
</body>
</html>
